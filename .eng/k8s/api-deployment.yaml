apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-rag-ingestion-api
  annotations:
    # Reloader (k3s-apps) restarts the pods when a ConfigMap or Secret this Deployment uses changes.
    reloader.stakater.com/auto: "true"
  labels:
    app: doc-rag-ingestion-api
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: doc-rag-ingestion-api
  template:
    metadata:
      labels:
        app: doc-rag-ingestion-api
    spec:
      containers:
        - name: doc-rag-ingestion-api
          # Name/tag stamped by docker-publish.yml (kustomize edit set image).
          image: doc-rag-ingestion-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: doc-rag-ingestion-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "doc-rag-ingestion-api"
            # Keep the system roots and add the private CA that signs Keycloak (ConfigMap home-arpa-ca, kept up to
            # date in every namespace by the trust-manager Bundle in k3s-apps).
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/ssl/home-arpa
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-secrets
                  key: connection-string
            - name: Garage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-garage-secrets
                  key: access-key
            - name: Garage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-garage-secrets
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          volumeMounts:
            - name: home-arpa-ca
              mountPath: /etc/ssl/home-arpa
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: home-arpa-ca
          configMap:
            name: home-arpa-ca
