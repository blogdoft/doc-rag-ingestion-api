# Continuous integration: everything that validates the code and publishes nothing. Runs on
# PRs and is called by cd.yml on every push to main, so the release is gated by the exact same
# checks. To add a check, add a step to `build-test` or a new job here -
# cd.yml needs no change, it waits for every job of this workflow.

name: CI

on:
  pull_request:
  workflow_call:

jobs:
  build-test:
    runs-on: self-hosted
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      # actions/checkout is a Node action and the redocly lint below needs npx; the dotnet SDK image
      # ships neither, and the runner does not inject Node into custom job containers.
      - name: Install Node.js
        run: apt-get update && apt-get install -y --no-install-recommends nodejs npm

      - uses: actions/checkout@v4

      - name: Restore
        run: dotnet restore DocRag.Ingestion.slnx

      - name: Build with analyzers (any remaining warning fails the build)
        run: dotnet build DocRag.Ingestion.slnx --no-restore -c Release -p:TreatWarningsAsErrors=true

      - name: Unit and API tests
        run: |
          dotnet test tests/DocRag.Ingestion.Domain.Tests --no-build -c Release
          dotnet test tests/DocRag.Ingestion.Application.Tests --no-build -c Release
          dotnet test tests/DocRag.Ingestion.Api.Tests --no-build -c Release

      - name: "Integration tests (Testcontainers: PostgreSQL, Garage, Kafka)"
        run: dotnet test tests/DocRag.Ingestion.Infrastructure.Tests --no-build -c Release

      - name: Validate the generated OpenAPI 3.1 document
        run: |
          OPENAPI_OUTPUT="$PWD/openapi.json" dotnet test tests/DocRag.Ingestion.Api.Tests --no-build -c Release --filter "FullyQualifiedName~OpenApiDocumentTests"
          npx --yes @redocly/cli@1 lint openapi.json --skip-rule=no-empty-servers --skip-rule=operation-4xx-response --skip-rule=security-defined

      - name: Dependency vulnerability scan
        run: |
          dotnet list DocRag.Ingestion.slnx package --vulnerable --include-transitive 2>&1 | tee vulns.txt
          ! grep -q "has the following vulnerable packages" vulns.txt

  docker:
    runs-on: self-hosted
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f .eng/docker/Dockerfile --target api -t doc-rag-ingestion-api:ci .
          docker build -f .eng/docker/Dockerfile --target worker -t doc-rag-ingestion-worker:ci .
