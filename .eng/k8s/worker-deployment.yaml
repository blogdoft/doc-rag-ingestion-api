apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-rag-ingestion-worker
  annotations:
    # Reloader (k3s-apps) restarts the pods when a ConfigMap or Secret this Deployment uses changes.
    reloader.stakater.com/auto: "true"
  labels:
    app: doc-rag-ingestion-worker
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: doc-rag-ingestion-worker
  template:
    metadata:
      labels:
        app: doc-rag-ingestion-worker
    spec:
      containers:
        - name: doc-rag-ingestion-worker
          # Name/tag stamped by docker-publish.yml (kustomize edit set image).
          image: doc-rag-ingestion-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: doc-rag-ingestion-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "doc-rag-ingestion-worker"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-secrets
                  key: connection-string
            - name: Garage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-garage-secrets
                  key: access-key
            - name: Garage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: doc-rag-ingestion-garage-secrets
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
