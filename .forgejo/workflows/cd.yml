# Continuous delivery, triggered by every push to main: runs ci.yml as a gate, releases the commit
# (next vX.Y.Z tag + release notes), then builds and publishes
# the api and worker images to this repo's Forgejo Container Registry and deploys them by stamping
# the version onto .eng/k8s/ and pushing the result into the argo-local-apps GitOps repo
# (manifests/code-brain/doc-rag-ingestion-api/) - ArgoCD takes it from there.
# Every push to main that passes ci.yml is released: .forgejo/scripts/release.sh picks the bump from
# the conventional commits since the last tag (`type!:` or a BREAKING CHANGE footer = major,
# `feat` = minor, anything else = patch) and creates the vX.Y.Z tag and its release notes through
# the Forgejo API. The image built from that commit carries the version.
# Nothing that only validates the code belongs here: put it in ci.yml. To add a release or
# deploy step, add it to `publish` or `deploy` (or a new job in the chain).
#
# Assumes a self-hosted act_runner labeled "self-hosted" with access to a Docker daemon.
# Registry settings: REGISTRY, REGISTRY_IMAGE and REGISTRY_USERNAME are repo/org variables
# (the worker image is published as "${REGISTRY_IMAGE}-worker"); REGISTRY_PASSWORD and
# ARGO_DEPLOY_SSH_KEY are repo secrets; RELEASE_TOKEN (a Forgejo token that can write this repo's
# releases) is optional - the release job falls back to the workflow's own token when unset.

name: CD

on:
  push:
    branches: [main]

# Runs are queued (not cancelled): each one computes the next version from the tags left by the
# previous one, so they must not overlap.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The next version is derived from the commits since the last tag.
          fetch-depth: 0

      - name: Install jq and curl
        run: apk add --no-cache jq curl

      - name: Create tag and release notes (conventional commits)
        id: release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash .forgejo/scripts/release.sh

  publish:
    needs: release
    runs-on: self-hosted
    env:
      VERSION: ${{ needs.release.outputs.version }}
    outputs:
      deploy_tag: ${{ steps.tag.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the container registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USERNAME }}" --password-stdin

      - name: Determine image tags
        id: tag
        run: echo "deploy_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          for target in api worker; do
            image="${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}"
            [ "$target" = "worker" ] && image="${image}-worker"
            docker build --target "$target" --build-arg VERSION="${VERSION}" \
              -t "${image}:${VERSION}" -t "${image}:latest" -f .eng/docker/Dockerfile .
            docker push "${image}:${VERSION}"
            docker push "${image}:latest"
          done

  deploy:
    needs: publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        # Forgejo injects its own GITHUB_TOKEN into every job; github.com rejects it when the
        # install script uses it, so clear it for this step only.
        env:
          GITHUB_TOKEN: ""
        run: |
          if [ ! -x /tmp/kustomize-bin/kustomize ]; then
            mkdir -p /tmp/kustomize-bin
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /tmp/kustomize-bin
          fi
          echo "/tmp/kustomize-bin" >> "$GITHUB_PATH"

      - name: Stamp images into manifests
        run: |
          cd .eng/k8s
          kustomize edit set image \
            "doc-rag-ingestion-api=${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}:${{ needs.publish.outputs.deploy_tag }}" \
            "doc-rag-ingestion-worker=${{ vars.REGISTRY }}/${{ vars.REGISTRY_IMAGE }}-worker:${{ needs.publish.outputs.deploy_tag }}"

      - name: Install openssh-client
        run: apk add --no-cache openssh-client

      # ARGO_DEPLOY_SSH_KEY: private half of a dedicated deploy key with write access to
      # sauron/argo-local-apps (Settings > Deploy keys, "Read and Write" enabled).
      # ARGO_SSH_KNOWN_HOSTS (org/repo variable) pins the host key of forgejo.home.arpa:2222.
      - name: Configure SSH
        run: |
          echo "${{ secrets.ARGO_DEPLOY_SSH_KEY }}" > "${{ github.workspace }}/.ssh-key"
          chmod 600 "${{ github.workspace }}/.ssh-key"
          echo "${{ vars.ARGO_SSH_KNOWN_HOSTS }}" > "${{ github.workspace }}/.ssh-known-hosts"

      - name: Sync manifests to argo-local-apps
        env:
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.ssh-key -o UserKnownHostsFile=${{ github.workspace }}/.ssh-known-hosts -o StrictHostKeyChecking=yes
        run: |
          WORKDIR=$(mktemp -d)
          git clone --depth 1 ssh://git@forgejo.home.arpa:2222/sauron/argo-local-apps.git "$WORKDIR"

          target="$WORKDIR/manifests/code-brain/doc-rag-ingestion-api"
          rm -rf "$target"
          mkdir -p "$target"
          cp -r .eng/k8s/. "$target/"

          cd "$WORKDIR"
          git config user.name "doc-rag-ci"
          git config user.email "ci@doc-rag.local"
          git add manifests/code-brain/doc-rag-ingestion-api

          if git diff --cached --quiet; then
            echo "No manifest changes, skipping commit."
          else
            git commit -m "chore(doc-rag): deploy ingestion ${{ needs.publish.outputs.deploy_tag }}"
            git push origin main
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f "${{ github.workspace }}/.ssh-key" "${{ github.workspace }}/.ssh-known-hosts"

  # Housekeeping: keeps the 10 most recent version tags (releases and their notes are left
  # untouched). Runs last and only after a successful deploy, so a failure here never blocks or
  # hides a delivery.
  prune-tags:
    needs: deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all but the 10 most recent tags
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          KEEP: "10"
        run: bash .forgejo/scripts/prune-tags.sh
