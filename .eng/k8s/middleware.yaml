# Strips the routing-only /code-brain/doc-rag prefix before Traefik forwards to the service: the
# API routes are rooted at "api/v1/..." and "swagger". Referenced from ingress.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: doc-rag-ingestion-api-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /code-brain/doc-rag
